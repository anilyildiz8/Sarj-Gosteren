<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>8BitDo 2C Battery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1115;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 24px;
    }
    .title {
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .percent {
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .bar-wrap {
      width: min(260px, 80vw);
      height: 22px;
      border-radius: 999px;
      background: #1e2430;
      padding: 4px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #22c55e;
      transition: width 0.35s ease, background-color 0.35s ease;
    }
    .status {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      max-width: 320px;
      line-height: 1.45;
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    button:active { opacity: 0.75; }
    button:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="title">8BitDo Ultimate 2C</div>
  <div class="percent" id="pct">--%</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Switch controller to BT mode, then tap Connect.</div>
  <div class="actions">
    <button id="connectBtn" onclick="connect()">Connect</button>
    <button id="refreshBtn" class="secondary" onclick="refreshNow()" hidden>Refresh</button>
  </div>

  <script>
    const pctEl = document.getElementById('pct');
    const barEl = document.getElementById('bar');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    let activeDevice = null;
    let batteryChar = null;
    let pollTimer = null;

    function render(level, text) {
      if (typeof level === 'number' && level >= 0 && level <= 100) {
        pctEl.textContent = level + '%';
        barEl.style.width = level + '%';
        barEl.style.backgroundColor =
          level <= 20 ? '#ef4444' : level <= 45 ? '#f59e0b' : '#22c55e';
      } else {
        pctEl.textContent = '--%';
        barEl.style.width = '0%';
      }
      if (text !== undefined) statusEl.textContent = text;
    }

    function cleanup() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      batteryChar = null;
      refreshBtn.hidden = true;
      connectBtn.textContent = 'Connect';
    }

    async function readBattery() {
      if (!batteryChar) return;
      const val = await batteryChar.readValue();
      const level = val.getUint8(0);
      const name = activeDevice?.name || 'Controller';
      render(level, `${name} • updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
    }

    async function refreshNow() {
      try {
        await readBattery();
      } catch (err) {
        render(null, 'Could not read battery: ' + (err.message || err));
        cleanup();
      }
    }

    async function connect() {
      if (!navigator.bluetooth) {
        render(null, 'Open this page in Chrome on Android over HTTPS to use Bluetooth.');
        return;
      }

      if (activeDevice?.gatt?.connected) {
        activeDevice.gatt.disconnect();
        cleanup();
        render(null, 'Disconnected.');
        return;
      }

      try {
        statusEl.textContent = 'Select your 8BitDo controller...';
        const device = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: '8BitDo' },
            { services: ['battery_service'] }
          ],
          optionalServices: ['battery_service', 'device_information']
        });

        activeDevice = device;
        device.addEventListener('gattserverdisconnected', () => {
          cleanup();
          render(null, 'Disconnected.');
        });

        statusEl.textContent = 'Connecting...';
        const server = await device.gatt.connect();

        let service;
        try {
          service = await server.getPrimaryService('battery_service');
        } catch {
          // Standard 0x180F battery service not exposed by this firmware
          let found = [];
          try {
            const svcs = await server.getPrimaryServices();
            found = svcs.map((s) => s.uuid);
          } catch {}
          render(
            null,
            'Connected, but controller did not expose standard Battery Service (0x180F).' +
              (found.length ? ' Services: ' + found.join(', ') : '')
          );
          connectBtn.textContent = 'Disconnect';
          return;
        }

        batteryChar = await service.getCharacteristic('battery_level');
        await readBattery();

        connectBtn.textContent = 'Disconnect';
        refreshBtn.hidden = false;

        try {
          await batteryChar.startNotifications();
          batteryChar.addEventListener('characteristicvaluechanged', (e) => {
            const level = e.target.value.getUint8(0);
            const name = activeDevice?.name || 'Controller';
            render(level, `${name} • live`);
          });
        } catch {
          // Low-power fallback poll every 30s if notifications aren't supported
          pollTimer = setInterval(refreshNow, 30000);
        }
      } catch (err) {
        if (err.name === 'NotFoundError') {
          statusEl.textContent = 'No device selected.';
        } else {
          render(null, err.message || String(err));
        }
      }
    }

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
